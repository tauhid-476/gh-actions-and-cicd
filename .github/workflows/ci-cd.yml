name: Production CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------------
  # JOB 1: THE BUILD FACTORY (Continuous Integration)
  # This runs on GitHub's computers, not yours.
  # -----------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (for testing)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cicd-pipeline-demo:latest


  # -----------------------------------------------------------------
  # JOB 2: THE DEPLOYMENT (Continuous Deployment)
  # This only runs if Job 1 succeeds.
  # -----------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps: 
      - name: Connect to VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          scripts: |
            cd /home/azureuser/gh-actions-and-cicd || exit 1

            git pull origin main

            docker compose pull

            docker compose up -d

            docker image prune -f
  
  
  # -----------------------------------------------------------------
  # JOB 3: THE NOTIFICATION (The Informant)
  # Sends a message to your phone via Discord
  # -----------------------------------------------------------------
  notify:
    needs: [deploy]
    runs-on: ubuntu-latest

    if: always()

    steps: 
      - name: Send Discord Notifications
        env: 
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: 'The project {{ EVENT_PAYLOAD.repository.full_name }} has been deployed! 🚀'